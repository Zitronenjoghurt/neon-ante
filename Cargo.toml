[workspace]
resolver = "3"
members = ["app", "core", "games", "server", "web"]
default-members = ["app", "core", "games", "server"]

[workspace.package]
version = "0.1.0"
license = "MIT"
edition = "2024"

[profile.release]
codegen-units = 1
lto = true
strip = true

[workspace.dependencies]
neon-ante-core = { path = "core" }
neon-ante-games = { path = "games" }
ratatui = { version = "0.30.1", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
